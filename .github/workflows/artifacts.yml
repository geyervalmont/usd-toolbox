name: Build versioned packages

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  native:
    name: Native (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            library: libusd_toolbox_ffi.so
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            library: libusd_toolbox_ffi.a
          - os: macos-15-intel
            target: x86_64-apple-darwin
            library: libusd_toolbox_ffi.dylib
          - os: macos-15
            target: aarch64-apple-darwin
            library: libusd_toolbox_ffi.dylib
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            library: usd_toolbox_ffi.dll.lib
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install musl toolchain
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build and test native APIs
        run: |
          cargo build --locked --release --target ${{ matrix.target }} -p usd-toolbox-cli -p usd-toolbox-ffi
          cargo test --locked --release --target ${{ matrix.target }} -p usd-toolbox-core -p usd-toolbox-cli -p usd-toolbox-ffi
      - name: Compile and execute C consumer
        if: "!contains(matrix.target, 'musl')"
        run: python scripts/test_c_api.py target/${{ matrix.target }}/release/${{ matrix.library }}
      - name: Compile and execute musl C consumer
        if: contains(matrix.target, 'musl')
        run: python scripts/test_c_api.py target/${{ matrix.target }}/release/${{ matrix.library }} --compiler musl-gcc
      - name: Package versioned native artifacts
        run: python scripts/package_native.py --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: usd-toolbox-${{ matrix.target }}
          path: |
            target/dist/*.tar.gz
            target/dist/*.zip
            target/dist/*.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Build versioned browser package
        run: |
          cargo install wasm-bindgen-cli --version 0.2.128 --locked
          python scripts/build_web_package.py
          mkdir -p target/dist
          npm pack ./target/web-package --pack-destination ./target/dist
          sha256sum target/dist/*.tgz > target/dist/SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: usd-toolbox-web
          path: target/dist/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
