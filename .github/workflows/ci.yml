name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Check generated C header
        run: |
          cargo build -p usd-toolbox-ffi
          git diff --exit-code -- crates/ffi/include/usd_toolbox.h
      - run: cargo test --workspace
      - name: Check browser dependency graph
        run: >-
          cargo check
          -p usd-toolbox-core
          -p usd-toolbox-usd
          -p usd-toolbox-materialx
          -p usd-toolbox-gltf
          -p usd-toolbox-wasm
          --target wasm32-unknown-unknown

  reference-formats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install reference validators
        run: |
          python -m pip install usd-core==26.8 MaterialX==1.39.5
          npm install --prefix "$RUNNER_TEMP/gltf-validator" --no-save --silent gltf-validator@2.0.0-dev.3.10
      - name: Generate deterministic fixtures
        run: |
          cargo run -q -p usd-toolbox-usd --example write_usdz_fixture -- "$RUNNER_TEMP/material.usdz"
          cargo run -q -p usd-toolbox-materialx --example write_mtlx_fixture -- "$RUNNER_TEMP/material.mtlx"
          cargo run -q -p usd-toolbox-gltf --example write_glb_fixture -- "$RUNNER_TEMP/material.glb"
      - name: Validate USDZ with OpenUSD
        run: python scripts/validate_usdz.py "$RUNNER_TEMP/material.usdz"
      - name: Validate MaterialX with reference bindings
        run: python scripts/validate_materialx.py "$RUNNER_TEMP/material.mtlx"
      - name: Validate GLB with Khronos validator
        env:
          NODE_PATH: ${{ runner.temp }}/gltf-validator/node_modules
        run: node scripts/validate_gltf.cjs "$RUNNER_TEMP/material.glb"
